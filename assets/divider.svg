<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="26" viewBox="0 0 1200 26" role="presentation">
<defs>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7b5cff" stop-opacity="0"/>
    <stop offset="18%" stop-color="#7b5cff" stop-opacity="0.55"/>
    <stop offset="50%" stop-color="#00f7aa" stop-opacity="0.8"/>
    <stop offset="82%" stop-color="#ff4ecd" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#ff4ecd" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="orb" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
    <stop offset="35%" stop-color="#00f7aa" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#00f7aa" stop-opacity="0"/>
  </radialGradient>
  <filter id="dsoft" x="-50%" y="-400%" width="200%" height="900%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
</defs>
<rect x="0" y="12.25" width="1200" height="1.5" fill="url(#rule)"/>
<rect x="0" y="11.5" width="1200" height="3" fill="url(#rule)" opacity="0.4" filter="url(#dsoft)"/>
<ellipse cx="0" cy="13.0" rx="70" ry="7" fill="url(#orb)" opacity="0.85">
  <animate attributeName="cx" values="-80;1280" dur="7s" repeatCount="indefinite"/>
</ellipse>
<circle cx="0" cy="13.0" r="2.6" fill="#ffffff">
  <animate attributeName="cx" values="-80;1280" dur="7s" repeatCount="indefinite"/>
</circle>
</svg>